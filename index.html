<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="支持 Excel 导入的幸运观众抽奖工具" />
    <title>幸运观众抽奖</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/xlsx.full.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">活动现场 · 幸运观众</p>
        <h1>幸运观众抽奖</h1>
        <p class="lead">四组名单 · 每组每轮抽取三位幸运观众</p>
      </header>

      <div class="layout">
        <section class="card import-card" aria-labelledby="import-title">
          <div class="import-row">
            <div class="section-heading">
              <span class="step">01</span>
              <div>
                <h2 id="import-title">导入四组名单</h2>
                <p>一次选择 5 份 Excel 文件</p>
              </div>
            </div>

            <label class="drop-zone" for="file-input" id="drop-zone">
              <input id="file-input" type="file" accept=".xlsx,.xls,.csv" multiple />
              <span class="upload-icon" aria-hidden="true">↑</span>
              <strong>选择 5 份名单</strong>
              <span>也可以将文件一起拖到这里</span>
            </label>
          </div>
          <div class="file-summary" id="file-summary" hidden aria-live="polite">
            <span class="summary-dot" aria-hidden="true"></span>
            <span id="file-summary-text"></span>
          </div>
          <div class="group-summary" id="group-summary" aria-label="各组名单人数"></div>
        </section>

        <section class="card lottery-card" aria-labelledby="lottery-title">
          <div class="lottery-toolbar">
            <div class="section-heading compact">
              <span class="step">02</span>
              <div>
                <h2 id="lottery-title">开始抽奖</h2>
                <p id="participant-count">请先导入名单</p>
              </div>
            </div>
            <button class="button button-secondary" id="copy-result" type="button" disabled>复制结果图片</button>
          </div>

          <div class="results" id="results" aria-live="polite" aria-label="四组抽奖结果"></div>

          <div class="draw-options">
            <label class="checkbox-label">
              <input id="exclude-winners" type="checkbox" checked />
              后续抽奖排除已中奖观众
            </label>
            <button class="text-button" id="reset-history" type="button" disabled>重置中奖记录</button>
          </div>

          <button class="button button-primary draw-button" id="draw-button" type="button" disabled>
            开始抽奖
          </button>
          <p class="status" id="status" role="status">等待导入名单</p>
        </section>
      </div>

    </main>
    <script src="assets/app.js"></script>
  </body>
</html>
